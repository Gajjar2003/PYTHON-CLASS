<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

<h2>Student List</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
</tr>

{% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.email }}</td>
    <td>{{ student.age }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
