<!DOCTYPE html>
<html>
<head>
    <title>Doctor Profiles</title>
</head>
<body>

<h2>Doctor Profiles</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Specialization</th>
    <th>Experience</th>
    <th>Hospital</th>
    <th>Email</th>
</tr>

{% for doctor in doctors %}
<tr>
    <td>{{ doctor.name }}</td>
    <td>{{ doctor.specialization }}</td>
    <td>{{ doctor.experience }} Years</td>
    <td>{{ doctor.hospital }}</td>
    <td>{{ doctor.email }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
