<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Profile Form</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#2b2c2c,#dce9f2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    background:rgb(245, 184, 184);
    padding:35px;
    border-radius:12px;
    width:420px;
    box-shadow:0px 8px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:bold;
}

.btn-custom{
    width:100%;
}

</style>

</head>

<body>

<div class="form-box">

<h2>Doctor Profile</h2>

<form method="POST" action="{% url 'register'%}">
    {%csrf_token%}
<span class="text-success">{{meg}}</span>
<div class="mb-3">
    <input type="hidden" name="id" value="{{d.id}}">
<label class="form-label">Doctor Name</label>
<input type="text" class="form-control" name="name" placeholder="Enter doctor name" value="{{d.name}}">
</div>

<div class="mb-3">
<label class="form-label">Age</label>
<input type="number" class="form-control" name="age" placeholder="Enter age" value="{{d.age}}">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" name="email" placeholder="Enter email" value="{{d.email}}">
</div>

<div class="mb-3">
<label class="form-label">Phone</label>
<input type="text" class="form-control" name="phone" placeholder="Enter phone number" value="{{d.phone}}">
</div>

<div class="mb-3">
<label class="form-label">Specialization</label>
<input type="text" class="form-control" name="specialization" placeholder="Enter specialization" value="{{d.specialization}}">
</div>

<div class="mb-3">
<label class="form-label">Experience (Years)</label>
<input type="number" class="form-control" name="years" placeholder="Enter years of experience" value="{{d.years}}">
</div>

<div class="d-grid gap-2">
<button type="submit" class="btn btn-primary btn-custom">Submit</button>
<button type="reset" class="btn btn-danger btn-custom">Reset</button>
<a href="{% url 'display'%}" class="btn btn-warning">View All</a>
</div>

</form>

</div>

</body>
</html>
