<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctors Information</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background-color:#f5f7fa;
    }

    .container-box{
        margin-top:50px;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0px 4px 10px rgba(0,0,0,0.1);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        font-weight:bold;
    }

    table{
        text-align:center;
    }

    thead{
        background-color:#0d6efd;
        color:white;
    }
</style>

</head>

<body>

<div class="container">
    <div class="container-box">

        <h2>Doctors Information</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Specialization</th>
                        <th>Years Experience</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>

                <tbody>
                    {% for d in doctors %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ d.name }}</td>
                        <td>{{ d.age }}</td>
                        <td>{{ d.email }}</td>
                        <td>{{ d.phone }}</td>
                        <td>{{ d.specialization }}</td>
                        <td>{{ d.years }}</td>
                        <td><a href="{% url 'delete'%}?id={{d.id}}" class="btn btn-danger">Delete</a></td>
                        <td><a href="{% url 'edit'%}?id={{d.id}}" class="btn btn-primary">Edit</a></td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
            <a href="{% url 'index'%}" class="btn btn-warning">Back to Register</a>
        </div>

    </div>
</div>

</body>
</html>
