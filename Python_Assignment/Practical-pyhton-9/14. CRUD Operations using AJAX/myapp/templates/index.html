<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function (rt) {
            display()
            $("#upbtn").hide()
        })

        function addemp() {
            var name = $("#name").val()
            var age = $("#age").val()
            var email = $("#email").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()
            $.post('register', { csrfmiddlewaretoken, name, age, email, dept, salary }, function (rt) {
                alert(rt)


                $("#name").val("")
                $("#age").val("")
                $("#email").val("")
                $("#dept").val("")
                $("#salary").val("")
                display()
            })
        }

        function display() {
            $.get('display', {}, function (rt) {
                var row = ""

                rt.emp.map(ele => {
                    row += `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.age}</td>
                        <td>${ele.email}</td>
                        <td>${ele.dept}</td>
                        <td>${ele.salary}</td>
                        <td><button class='btn btn-danger' onclick='deleteitems(${ele.id})'>Delete</button></td>
                        <td><button class='btn btn-primary' onclick= 'edititems(${ele.id})'>Edit</button></td>
                    </tr>`
                })

                $("#tdata").html(row)
            })
        }
        function deleteitems(eid) {
            $.get('delete', { eid }, function (rt) {
                alert(rt)
                display()
            })
        }

        function edititems(eid) {
            $.get('edit', { eid }, function (rt) {
                $("#id").val(rt.emp[0].id)
                $("#name").val(rt.emp[0].name)
                $("#age").val(rt.emp[0].age)
                $("#email").val(rt.emp[0].email)
                $("#dept").val(rt.emp[0].dept)
                $("#salary").val(rt.emp[0].salary)

                $("#upbtn").show()
                $("#smbtn").hide()

            })
        }
        function updateitems(eid) {
            var id  = $("#id").val()
            var name = $("#name").val()
            var age = $("#age").val()
            var email = $("#email").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()
            $.post('update', { csrfmiddlewaretoken, id,name, age, email, dept, salary }, function (rt) {
                alert(rt)


                $("#name").val("")
                $("#age").val("")
                $("#email").val("")
                $("#dept").val("")
                $("#salary").val("")
                display()
            })
        }


    </script>

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">Employee Form</h2>

        <!-- Form -->
        <div class="card p-4 shadow">
            <div class="row g-3">
                {%csrf_token%}
                <input type="hidden" name="id" id="id">
                <div class="col-md-4">
                    <input type="text" id="name" class="form-control" placeholder="Enter Name">
                </div>

                <div class="col-md-4">
                    <input type="number" id="age" class="form-control" placeholder="Enter Age">
                </div>

                <div class="col-md-4">
                    <input type="email" id="email" class="form-control" placeholder="Enter Email">
                </div>

                <div class="col-md-4">
                    <input type="text" id="dept" class="form-control" placeholder="Enter Department">
                </div>

                <div class="col-md-4">
                    <input type="number" id="salary" class="form-control" placeholder="Enter Salary">
                </div>

                <div class="col-md-4">
                    <button class="btn btn-success w-100" onclick="addemp()" id="smbtn">Submit</button>
                    <button class="btn btn-primary w-100" onclick="updateitems()" id="upbtn">Update</button>
                </div>

            </div>
        </div>


        <!-- Table -->
        <div class="card mt-4 shadow">
            <div class="card-body">

                <h4 class="text-center mb-3">Employee List</h4>

                <table class="table table-bordered table-striped text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>

                    <tbody id="tdata">
                    </tbody>

                </table>

            </div>
        </div>

    </div>




</body>

</html>
