<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Table</h1>
 <table align="center" border="3px solid balck" cellspacing="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Phone</th>
        <th>Image</th>
        <th colspan="2">Action</th>
    </tr>
    {% for s in students%}
    <tr>
        <td>{{s.id}}</td>
        <td>{{s.name}}</td>
        <td>{{s.email}}</td>
        <td>{{s.age}}</td>
        <td>{{s.phone}}</td>
        <td><img src="/media/{{s.image}}" alt="{{s.image}}" height="50px" width="50px"></td>
        <td><a href="{% url 'delete'%}?id={{s.id}}">Delete</a></td>
        <td><a href="{% url 'edit'%}?id={{s.id}}">Edit</a></td>

    </tr>
    {% endfor %}
 </table>
 <h5 align="center"><a href="{% url 'index'%}">Back</a></h5>
</body>
</html>
