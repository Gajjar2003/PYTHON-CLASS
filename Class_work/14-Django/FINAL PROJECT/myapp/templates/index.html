<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2, #43cea2);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: slideFade 1s ease;
        }

        @keyframes slideFade {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-title {
            text-align: center;
            color: #fff;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-floating input {
            border-radius: 14px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-floating input:focus {
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }

        .image-upload {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            padding: 10px;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            margin-top: 10px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #fff;
            font-weight: 500;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="glass-card">
    <h3 class="form-title">Create Your Account</h3>

    <form method="post" enctype="multipart/form-data" action="{% url 'register' %}">
        {% csrf_token %}
        <span class="text-success">{{meg}}</span>

        <input type="hidden" name="id" value="{{s.id}}">
        <div class="form-floating mb-3">
            <input type="text" name="fname" class="form-control" placeholder="First Name" value="{{s.fname}}">
            <label>First Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" name="lname" class="form-control" placeholder="Last Name" value="{{s.lname}}">
            <label>Last Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" value="{{s.username}}">
            <label>Username</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" value="{{s.password}}">
            <label>Password</label>
        </div>

        <div class="mb-3 image-upload">
            <label class="form-label fw-semibold">Profile Image</label>
            {%if s%}
            <img src="media/{{s.image}}" alt="{{s.image}}" height="50px" width="50px"><br><br>
            {% endif %}
            <input type="file" name="image" class="form-control">
        </div>

        <button type="submit" class="btn btn-register text-white">Register</button>
        <button type="reset" class="btn btn-light btn-reset">Reset</button><br>
        <a href="{% url 'display' %}"  class="btn btn-primary text-white" style="margin-top: 10px; width: 100%; border-radius: 50px; height: 50px;" >Display</a>

      
        <a href="{% url 'user-login' %}" class="register-link" style="color: white; margin-left: 65px;">
            You have an account? Login
    </form>
</div>

</body>
</html>
