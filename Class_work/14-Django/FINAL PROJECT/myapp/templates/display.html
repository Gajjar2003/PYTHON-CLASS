<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2, #43cea2);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-table-card {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: fadeSlide 1s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .table-title {
            text-align: center;
            color: #fff;
            font-weight: 600;
            margin-bottom: 20px;
        }

        table {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: #fff;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: rgba(40, 167, 69, 0.1);
            transition: 0.3s;
        }

        .profile-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #28a745;
        }

        .btn-action {
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="glass-table-card">
    <h3 class="table-title">Registered Users</h3>

    <div class="table-responsive">
        <table class="table table-borderless table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Image</th>
                    <th colspan="2">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{s.fname}}</td>
                    <td>{{s.lname}}</td>
                    <td>{{s.username}}</td>
                    <td>{{s.password}}</td>
                    <td><img src="media/{{s.image}}" alt="{{s.image}}" height="50px" width="50px"></td>
                     <td><a href="{% url 'delete' %}?id={{s.id}}">Delete</a></td>
                      <td><a href="{% url 'edit' %}?id={{s.id}}">Edit</a></td>
                </tr>
                {% endfor %}
            </tbody>

           
           
        </table>
        <a href="{% url 'index' %}"  class="btn btn-primary text-white" style="margin-top: 10px; width: 100%; border-radius: 50px; height: 50px;" >Display</a>

    </div>
</div>

</body>
</html>
