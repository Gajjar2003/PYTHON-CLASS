{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication</title>

  <style>
    body {
      background: linear-gradient(135deg, #9099ea, #f36794);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: white;
      font-weight: bold;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .images-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px; 
    }

    .auth-img {
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      height: 800px;
      width: 900px;
      object-fit: cover;
    }
.back-button {
  display: inline-block;
  padding: 10px 25px;
  background-color: #ffffff;
  color: #1d2671;           
  font-weight: bold;
  text-decoration: none;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: all 0.3s ease;


  position: absolute;
  top: 30px;   
  right: 30px; 
}

.back-button:hover {
  background-color: #1d2671; 
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.4);
}

   
    @media (max-width: 1000px) {
      .auth-img {
        width: 80%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>User Authentication</h1>
  <a href="{% url 'home' %}" class="back-button">Back</a>

  <div class="images-row">
    <img src="{% static 'image/1.png' %}" class="auth-img">
    <img src="{% static 'image/2.png' %}" class="auth-img">
    <img src="{% static 'image/3.png' %}" class="auth-img">
    <img src="{% static 'image/4.png' %}" class="auth-img">
    <img src="{% static 'image/5.png' %}" class="auth-img">
    <img src="{% static 'image/6.png' %}" class="auth-img">
    <img src="{% static 'image/7.png' %}" class="auth-img">
    <img src="{% static 'image/8.png' %}" class="auth-img">
  </div>

  
</body>
</html>
