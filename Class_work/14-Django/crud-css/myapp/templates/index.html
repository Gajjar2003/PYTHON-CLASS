<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col-5 card p-3">
                <h1>Product information</h1>
                <hr>
                <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="id" value="{{p.id}}">

                    <select class="form-control" name="cat" id="cat">
                     
                        {% for cat in categorys %}
                        <option value="{{ cat.id }}" {% if p.cat.id == cat.id %} selected {% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>


                    <br>

                    <input type="text" placeholder="Enter your name" name="name" class="form-control"
                        value="{{p.name}}"><br>
                    <input type="text" placeholder="Enter your price" name="price" class="form-control"
                        value="{{p.price}}"><br>
                    <input type="text" placeholder="Enter your qty" name="qty" class="form-control"
                        value="{{p.qty}}"><br>
                    {% if p%}
                    <img src="media/{{p.image}}" alt="" width="50px" height="50px">
                    <span>{{p.image}}</span><br> <br>
                    {% endif%}
                    <input type="file" name="image" class="form-control"><br>

                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                </form>

            </div>
            <div class="col-1">

            </div>
            <div class="col-6 card p-3">
                <h1>Proudct details</h1>
                <hr>
                <table class="table">
                    <tr>
                        <th>ID</th>
                        <th>P-name</th>
                        <th>P-price</th>
                        <th>P-qty</th>
                        <th>Category</th>
                        <th>Image</th>
                        <th colspan="2">Action</th>
                    </tr>
                    {% for p in products %}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{p.name}}</td>
                        <td>{{p.price}}</td>
                        <td>{{p.qty}}</td>
                        <td>{{p.category.name}}</td>
                        <td><img src="media/{{p.image}}" alt="{{p.image}}" height="50px" width="50px"></td>
                        <td><a href="{% url 'delete' %}?id={{p.id}}" class="btn btn-danger">Delete</a></td>
                        <td><a href="{% url 'edit' %}?id={{p.id}}" class="btn btn-primary">Edit</a></td>
                    </tr>
                    {% endfor %}
                </table>

            </div>




        </div>
    </div>
</body>

</html>
