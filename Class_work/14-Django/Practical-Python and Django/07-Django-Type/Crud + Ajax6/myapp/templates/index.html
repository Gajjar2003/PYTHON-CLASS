<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Form</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background: #f5f5f5;
        }

        .form-container {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .table-container {
            width: 80%;
            margin: 30px auto;
        }
    </style>
    <script>
        $(document).ready(function (rt) {
            displayitems()
            $("#upbtn").hide()
        })
        function addstudent() {

            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var marks = $("#marks").val()
            var subject = $("#subject").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post('register', { csrfmiddlewaretoken, name, email, age, marks, subject }, function (rt) {

                alert(rt)
                displayitems()
                $("#name").val("")
                $("#email").val("")
                $("#age").val("")
                $("#marks").val("")
                $("#subject").val("")

            })
        }

        function displayitems(){
            $.get('display',{},function(rt){
                row =""
                rt.st.map(ele =>{
                    row+=`<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td>${ele.marks}</td>
                        <td>${ele.subject}</td>
                        <td><button class='btn btn-danger' onclick=deleteitems(${ele.id})>Delete</button></td>
                        <td><button class='btn btn-primary' onclick=edititems(${ele.id})>Edit</button></td></tr>`
                        
                })
                $("#tdata").html(row)
            })
        }
        function deleteitems(sid){
            $.get('delete',{sid},function(rt){
                alert(rt)
                displayitems()
            })
        }

        function edititems(sid){
            $.get('edit',{sid},function(rt){
                $("#id").val(rt.st[0].id)
                $("#name").val(rt.st[0].name)
                $("#email").val(rt.st[0].email)
                $("#age").val(rt.st[0].age)
                $("#marks").val(rt.st[0].marks)
                $("#subject").val(rt.st[0].subject)

                $("#upbtn").show()
                $("#smbtn").hide()
            })
        }

        function updatestudent() {
            var id  = $("#id").val()
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var marks = $("#marks").val()
            var subject = $("#subject").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post('update', { csrfmiddlewaretoken, id,name, email, age, marks, subject }, function (rt) {

                alert(rt)
                displayitems()
                $("#id").val("")
                $("#name").val("")
                $("#email").val("")
                $("#age").val("")
                $("#marks").val("")
                $("#subject").val("")

            })
        }
    </script>


</head>

<body>

    <!-- Student Form -->
    <div class="form-container">
        <h3 class="text-center mb-4">Student Form</h3>

        <form method="post">
            {%csrf_token%}
            <input type="hidden" id="id"  name="id">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter Name" name="name" id="name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter Email" name="email" id="email">
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" placeholder="Enter Age" name="age" id="age">
            </div>

            <div class="mb-3">
                <label class="form-label">Marks</label>
                <input type="number" class="form-control" placeholder="Enter Marks" name="marks" id="marks">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" placeholder="Enter Subject" name="subject"  id="subject">
            </div>

            <button type="submit" class="btn btn-success w-100" onclick="addstudent()" id="smbtn">Submit</button><br>
             <button type="submit" class="btn btn-primary w-100" onclick="updatestudent()" id="upbtn">Update</button>

        </form>
    </div>


    <!-- Student Table -->
    <div class="table-container">

        <h3 class="text-center mb-3">Student List</h3>

        <table class="table table-bordered table-striped text-center">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Marks</th>
                    <th>Subject</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>

            <tbody id="tdata">


                <tr></tr>

            </tbody>

        </table>

    </div>

</body>

</html>
