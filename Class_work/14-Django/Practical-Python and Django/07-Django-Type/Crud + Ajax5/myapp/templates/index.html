<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 10px;
        }

        .table thead {
            background: #0d6efd;
            color: white;
        }

        .btn-custom {
            width: 120px;
        }
    </style>
<script>
    $(document).ready(function(rt){
       viewdetlis()
       $("#upbtn").hide()
    })

    function addstudent(){
        var name = $("#name").val()
        var age = $("#age").val()
        var email =$("#email").val()
        var phone = $("#phone").val()
        var subject = $("#subject").val()
        var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()


        $.post('register',{csrfmiddlewaretoken,name,age,email,phone,subject},function(rt){
            alert(rt)
            viewdetlis()
        })
    }

    function viewdetlis(){
        $.get('display',{},function(rt){
            row = ""
            rt.st.map(ele =>{
                row+=`<tr><td>${ele.id}</td>
                    <td>${ele.name}</td>
                    <td>${ele.age}</td>
                    <td>${ele.email}</td>
                    <td>${ele.phone}</td>
                    <td>${ele.subject}</td>
                    <td><button class='btn btn-danger' onclick='deleteitems(${ele.id})'>Delete</button></td>
                     <td><button class='btn btn-primary' onclick='edititmes(${ele.id})'>Edit</button></td></tr>`
                    
            })
            $("#tdata").html(row)
        })
    }
     function deleteitems(sid){
        $.get('delete',{sid},function(rt){
            alert(rt)
            viewdetlis()
        })
     }

     function edititmes(sid){
        $.get('edit',{sid},function(rt){
           $("#id").val(rt.st[0].id)
           $("#name").val(rt.st[0].name)
           $("#age").val(rt.st[0].age)
           $("#email").val(rt.st[0].email)
           $("#phone").val(rt.st[0].phone)
           $("#subject").val(rt.st[0].subject)
            
           $("#upbtn").show()
           $("#smbtn").hide()
        })
     }

     function update(){
        var id = $("#id").val()
        var name = $("#name").val()
        var age = $("#age").val()
        var email =$("#email").val()
        var phone = $("#phone").val()
        var subject = $("#subject").val()
        var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()


        $.post('update',{csrfmiddlewaretoken,id,name,age,email,phone,subject},function(rt){
            alert(rt)
            viewdetlis()
        })
    }

</script>
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <!-- Form Section -->
            <div class="col-md-4">
                <div class="card shadow p-4">

                    <h4 class="text-center mb-4">Student Form</h4>

                    <form>
                        {%csrf_token%}
                        <input type="hidden" name="id" id="id">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="text" class="form-control" id="age" name="age">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject">
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-success" onclick="addstudent()" id="smbtn">Submit</button>
                               <button type="submit" class="btn btn-primary btn-custom" onclick="update()" id="upbtn">update</button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- Table Section -->
            <div class="col-md-8">

                <div class="card shadow p-4">

                    <h4 class="mb-3">Student List</h4>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover text-center">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Subject</th>
                                    <th colspan="2">Action</th>
                                </tr>
                            </thead>

                            <tbody id="tdata">
                                <tr>
                                    <td></td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>

            </div>

        </div>
    </div>

</body>

</html>
