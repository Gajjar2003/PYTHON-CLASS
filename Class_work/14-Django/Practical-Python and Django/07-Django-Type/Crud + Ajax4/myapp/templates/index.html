<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 12px;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
    <script>
        $(document).ready(function (rt) {
            viewdetalis()
            $("#upbtn").hide()
        })

        function addemployee() {
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var date = $("#date").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()

            $.post('register', { csrfmiddlewaretoken, name, email, age, dept, salary, date }, function (rt) {
                alert(rt)
            })
        }


        function viewdetalis() {
            $.get('view', {}, function (rt) {
                row = ""
                rt.e.map(ele => {
                    row += `<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td>${ele.dept}</td>
                        <td>${ele.salary}</td>
                        <td>${ele.date}</td>
                        <td><button class='btn btn-danger' onclick='deleteitem(${ele.id})'>Delete</button></td>
                         <td><button class='btn btn-primary' onclick='edititem(${ele.id})'>Edit</button></td></tr>`
                })
                $("#tdata").html(row)
            })
        }

        function deleteitem(eid) {
            $.get('delete', { eid }, function (rt) {
                alert(rt)
                viewdetalis()
            })
        }

        function edititem(eid) {
            $.get('edit', { eid }, function (rt) {
                $("#id").val(rt.e[0].id)
                $("#name").val(rt.e[0].name)
                $("#email").val(rt.e[0].email)
                $("#age").val(rt.e[0].age)
                $("#dept").val(rt.e[0].dept)
                $("#salary").val(rt.e[0].salary)
                $("#date").val(rt.e[0].date)

                $("#upbtn").show()
                $("#smbtn").hide()
            })
        }

         function updateemployee() {
            var id = $("#id").val()
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var date = $("#date").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()

            $.post('update', { csrfmiddlewaretoken, id ,name, email, age, dept, salary, date }, function (rt) {
                alert(rt)
            })
        }
        
    </script>
</head>

<body>

    <div class="container mt-5">

        <!-- Form Card -->
        <div class="card shadow p-4 mb-5 bg-white">
            <h3 class="text-center mb-4">Employee Registration Form</h3>

            <form>
                {%csrf_token%}
                <input type="hidden" name="id" id="id">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" id="name" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" name="age" id="age" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="dept" id="dept" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Salary</label>
                        <input type="number" name="salary" id="salary" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Joining Date</label>
                        <input type="date" name="date" id="date" class="form-control">
                    </div>
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success px-5" onclick="addemployee()" id="smbtn">Submit</button>
                    <button type="submit" class="btn btn-primary px-5" onclick="updateemployee()" id="upbtn">Update</button>
                    <button type="reset" class="btn btn-secondary px-5">Reset</button>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card shadow p-4 bg-white">
            <h3 class="text-center mb-4">Employee Data</h3>

            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Dept</th>
                            <th>Salary</th>
                            <th>Date</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tdata">
                        <tr>
                            <td colspan="7" class="text-muted">No Data Available</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>

</html>
