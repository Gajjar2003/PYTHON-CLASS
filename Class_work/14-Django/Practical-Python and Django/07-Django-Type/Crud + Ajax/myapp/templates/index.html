<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register Ajax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
    <script>

        $(document).ready(function () {
            viewstudent()
            $("#udt").hide()

        })

        function addstudent() {

            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()


            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post('register', { csrfmiddlewaretoken, name, email, age }, function (rt) {
                alert(rt)

                $("#name").val("")
                $("#email").val("")
                $("#age").val("")

                viewstudent()
            })
        }

        function viewstudent() {

            $.get("display", {}, function (rt) {
                var row = ""
                rt.st.map(ele => {
                    row += `<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td><button class = 'btn btn-danger' onclick='deletestudent(${ele.id})'>Delete</button>
                        </td><td><button class ='btn btn-warning' onclick= 'editstudent(${ele.id})'>Edit</button></tr>`
                })
                $("#emt").html(row)

            })
        }
        function deletestudent(sid) {
            $.get('delete', { sid }, function (rt) {
                alert(rt)
                viewstudent()
            })
        }

        function editstudent(sid) {
            $.get('edit', { sid }, function (rt) {

                $("#id").val(rt.st[0].id)
                $("#name").val(rt.st[0].name)
                $("#email").val(rt.st[0].email)
                $("#age").val(rt.st[0].age)

                $("#udt").show()
                $("#smt").hide()

              

            })
        }
        function updatestudent() {

            var id = $("#id").val()
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()


            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post('update', { csrfmiddlewaretoken, id, name, email, age }, function (rt) {
                alert(rt)

                $("#id").val("")
                $("#name").val("")
                $("#email").val("")
                $("#age").val("")

                viewstudent()
                $("#udt").hide()
                $("#smt").show()

               
            })
        }



    </script>
</head>

<body>

    <div class="container mt-5">

        <div class="row">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h4 class="text-center mb-4">Employee Register</h4>

                    {%csrf_token%}
                    <form id="empForm">
                        <input type="hidden" name="id" id="id">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" id="age" class="form-control" placeholder="Enter your age">
                        </div>

                        
                            <button type="button" id="smt" class="btn btn-primary" onclick="addstudent()">
                                Add Employee
                            </button>
                            <button type="button" id="udt" class="btn btn-success" onclick="updatestudent()">
                                Update Employee
                            </button>
                     


                 

                    </form>

                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow p-4">
                    <h4 class="text-center mb-4">Employee List</h4>

                    <div class="table-responsive">
                        <table class="table table-bordered table-striped text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Age</th>
                                    <th colspan="2">Action</th>
                                </tr>
                            </thead>
                            <tbody id="emt">

                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</body>

</html>
