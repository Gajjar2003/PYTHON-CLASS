<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-5 mx-auto p-5 card mt-5" >
                <form action="" method="post">
                    {% csrf_token %}
                    <h1>User Login</h1>
                    <hr>
                    <span class="text-danger">{{err}}</span>
                    
                    <input type="text" placeholder="Enter Your Username" class="form-control" name="username"><br>
                    <input type="password" placeholder="Enter Your Password" class="form-control" name="password"><br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                    <a href="{% url 'user-register'%}" class=" btn btn-warning">Register here</a>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
