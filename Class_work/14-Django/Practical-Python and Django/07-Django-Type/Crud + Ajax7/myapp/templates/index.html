<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Electronic Items Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .container {
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row">
            <!-- FORM -->
            <div class="col-md-4">
                <div class="card p-3 shadow">
                    <h4 class="text-center">Add Electronic Item</h4>

                    <form id="itemForm" method="post">
                        {% csrf_token %}

                      <input type="hidden" id="id"  name="id">
                        <div class="mb-3">
                            <label class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="name" name="name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" name="category">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" class="form-control" id="price" name="price">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="qty" name="qty">
                        </div>

                        <button type="button" class="btn btn-primary w-100" onclick="addproduct()" id="smbtn">
                            Add Item
                        </button><br>
                          <button type="button" class="btn btn-success w-100" onclick="updateitems()" id="upbtn">
                            Update Item
                        </button>
                    </form>
                </div>
            </div>

            <!-- TABLE -->
            <div class="col-md-8">
                <div class="card p-3 shadow">
                    <h4 class="text-center">Electronic Items List</h4>

                    <table class="table table-bordered table-striped mt-3">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th colspan="2">Action</th>
                            </tr>
                        <tbody id="tdata">
                            <tr>
                                <td></td>
                            </tr>
                        </tbody>
                        </thead>
                        <tbody id="itemTable">
                            <!-- Data will come here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <!-- JavaScript -->
    `
    <script>
        $(document).ready(function (rt) {
            display()
            $("#upbtn").hide()
          
        })

        function addproduct() {

            var name = $("#name").val()
            var category = $("#category").val()
            var price = $("#price").val()
            var qty = $("#qty").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()


            $.post('register', { csrfmiddlewaretoken, name, category, price, qty }, function (rt) {
                alert(rt)
                display()

                $("#name").val("")
                $("#category").val("")
                $("#price").val("")
                $("#qty").val("")
            })
        }

        function display() {
            $.get('display', {}, function (rt) {
                row = ""
                rt.pro.map(ele => {
                    row += `<tr>
                            <td>${ele.id}</td>
                            <td>${ele.name}</td>
                            <td>${ele.category}</td>
                            <td>${ele.price}</td>
                            <td>${ele.qty}</td>
                            <td><button onclick='deleteitems(${ele.id})'>Delete</button></td>
                            <td><button onclick='edititems(${ele.id})'>Edit</button></td>
                        </tr>`
                       
                })
                $("#tdata").html(row)

            })
        }

        function deleteitems(pid){
            $.get("delete",{pid},function(rt){
                alert(rt)
                display()
            })
        }

        function edititems(pid){
            $.get('edit',{pid},function(rt){

                $("#id").val(rt.pro[0].id)
                $("#name").val(rt.pro[0].name)
                $("#category").val(rt.pro[0].category)
                $("#price").val(rt.pro[0].price)
                $("#qty").val(rt.pro[0].qty)
                  
               
                $("#upbtn").show()
                $("#smbtn").hide()

            })
        }
      
        function updateitems(){
            var id  =  $("#id").val()
            var name = $("#name").val()
            var category = $("#category").val()
            var price = $("#price").val()
            var qty = $("#qty").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()


            $.post('update', { csrfmiddlewaretoken, id ,name, category, price, qty }, function (rt) {
                alert(rt)
                display()

                $("#id").val("")
                $("#name").val("")
                $("#category").val("")
                $("#price").val("")
                $("#qty").val("")

                  $("#upbtn").hide()
                $("#smbtn").show()
            })
        }

 

    </script>

</body>

</html>
