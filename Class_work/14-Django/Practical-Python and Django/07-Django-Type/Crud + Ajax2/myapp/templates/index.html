<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: white;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
        }
    </style>
    <script>
        $(document).ready(function(rt){
           produtcview()
           $("#upbtn").hide()
        })

        function addproduct()
        {   
            var name = $("#name").val()
            
            var qty = $("#qty").val()
            var price  = $("#price").val()
           var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post("add",{csrfmiddlewaretoken,name,qty,price},function(rt){
                alert(rt)
                produtcview()
            })
        }

        function produtcview(){
            $.get('display',{},function(rt){
                row = ""
                rt.p.map(ele =>{
                   row += `<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.qty}</td>
                        <td>${ele.price}</td>
                        <td><button class='btn btn-danger' onclick='deleteitems(${ele.id})'>Delete</bitton></td>
                        <td><button class= 'btn btn-primary' onclick = 'edititems(${ele.id})'>edit</button></td></tr>`
                })
                $("#tdata").html(row)
            })
        }

        function deleteitems(pid){
            $.get('delete',{pid},function(rt){
                alert(rt)
                produtcview()
             
            })
        }

        function edititems(pid){
            $.get('edit',{pid},function(rt){
                $("#id").val(rt.p[0].id)
                $("#name").val(rt.p[0].name)
                 $("#qty").val(rt.p[0].qty)
                  $("#price").val(rt.p[0].price)

                  $("#upbtn").show()
                  $("#smbtn").hide()

            })
        }

           function updateproduct()
        {   
            var id = $("#id").val()
            var name = $("#name").val()
            var qty = $("#qty").val()
            var price  = $("#price").val()
           var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

            $.post("update",{csrfmiddlewaretoken,id,name,qty,price},function(rt){
                alert(rt)

                produtcview()
            })
        }


        
    </script>
</head>
<body>

<div class="container mt-5">

    <!-- Form Card -->
    <div class="card shadow p-4 mb-4">
        <h4 class="text-center mb-4">Add Product</h4>

        <form action="">
            {%csrf_token%}

            <input type="hidden" name="id" id="id">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" id="name" class="form-control" placeholder="Enter Name" name="name">
            </div>
          
            <div class="col-md-2">
                <input type="number" id="qty" class="form-control" placeholder="Qty" name="qty">
            </div>
            <div class="col-md-2">
                <input type="number" id="price" class="form-control" placeholder="Price" name="price">
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-success" onclick="addproduct()" id="smbtn">Add</button><br>
                <button class="btn btn-primary" onclick="updateproduct()" id="upbtn">Update</button>
            </div>
        </div>
    </div>
</form>
    <!-- Table Card -->
    <div class="card shadow p-4">
        <h4 class="text-center mb-4">Product List</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>
                <tbody id="tdata">
                    <tr>
                       
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
