<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 15px;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>

    <script>
        $(document).ready(function (rt) {
            allview()
            $("#upbtn").hide()
        })

        function addstudent() {
            var name = $("#name").val()
            var email = $("#email").val()
            var subject = $("#subject").val()
            var age = $("#age").val()
            var marks = $("#marks").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()


            $.post('register', { csrfmiddlewaretoken, name, email, subject, age, marks }, function (rt) {
                alert(rt)
                allview()

            })
        }

        function allview() {
            $.get('view', {}, function (rt) {
                row = ""
                rt.student.map(ele => {
                    row += `<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.subject}</td>
                        <td>${ele.age}</td>
                        <td>${ele.marks}</td>
                        <td><button class='btn btn-danger' onclick="studentdelete(${ele.id})">Delete</button></td>
                        <td><button class='btn btn-primary' onclick = 'getbyid(${ele.id})'>Edit</button></td></tr>`
                })
                $("#tdata").html(row)


            })
        }



        function studentdelete(sid) {
            $.get("delete", { sid }, function (rt) {
                alert(rt)
                allview()
            })
        }

        function getbyid(sid) {
            $.get('getbyid', { sid }, function (rt) {
                $("#id").val(rt.s[0].id)
                $("#name").val(rt.s[0].name)
                $("#email").val(rt.s[0].email)
                $("#subject").val(rt.s[0].subject)
                $("#age").val(rt.s[0].age)
                $("#marks").val(rt.s[0].marks)

                $("#upbtn").show()
                $("#smbtn").hide()


            })
        }
 function updatestudent() {
    var id = $("#id").val()
    var name = $("#name").val()
    var email = $("#email").val()
    var subject = $("#subject").val()
    var age = $("#age").val()
    var marks = $("#marks").val()
    var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()

    $.post("update/", {csrfmiddlewaretoken, id, name, email, subject, age, marks}, function (rt) {
        alert(rt)
        allview()
        
        $("#upbtn").hide()
        $("#smbtn").show()

        $("#name").val("")
        $("#email").val("")
        $("#subject").val("")
        $("#age").val("")
        $("#marks").val("")
    })
}


    </script>
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <!-- Form Section -->
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h4 class="text-center mb-4">Student Registration</h4>

                    <form>
                        {%csrf_token%}
                        <input type="hidden" name="id" id="id">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" id="name" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" id="subject" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" id="age" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Marks</label>
                            <input type="number" name="marks" id="marks" class="form-control">
                        </div>

                        <button type="button" class="btn btn-success w-100" onclick="addstudent()" id="smbtn">
                            Submit
                        </button>
                        <button type="button" class="btn btn-primary w-100" id="upbtn" onclick="updatestudent()">
                            Update
                        </button>
                    </form>
                </div>
            </div>

            <!-- Table Section -->
            <div class="col-md-7">
                <div class="card shadow p-4">
                    <h4 class="text-center mb-4">Student Records</h4>

                    <div class="table-responsive">
                        <table class="table table-bordered table-striped text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Id</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Subject</th>
                                    <th>Age</th>
                                    <th>Marks</th>
                                    <th colspan="2">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tdata">
                                <tr>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>

</html>
