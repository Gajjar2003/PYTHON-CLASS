<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Register Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .form-title {
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            color: #4e73df;
        }

       
    </style>
</head>

<body>

<div class="form-container">
    <h3 class="form-title">Employee Register Form</h3>
    <hr>

    <form action="{% url 'user-add'%}" method="POST" enctype="multipart/form-data">
       {% csrf_token %}

       <span class="text-success">{{meg}}</span>
        
        <input type="hidden" name="id" value="{{e.id}}">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter Full Name" name="fname" value="{{e.fname}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter Email" name="email"  value="{{e.email}}">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" placeholder="Enter Age" name="age"  value="{{e.age}}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input type="number" class="form-control" placeholder="Enter Salary" name="salary"  value="{{e.salary}}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="tel" class="form-control" placeholder="Enter Department" name="dept"  value="{{e.dept}}">
        </div>


        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="Enter Phone Number" name="phone"  value="{{e.phone}}">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control" placeholder="Enter City" name="city"  value="{{e.city}}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Pincode</label>
                <input type="number" class="form-control" placeholder="Enter Pincode" name="pincode"  value="{{e.pincode}}">
            </div>

           
        </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Image</label>
                <input type="file" name="image"  class="form-control" >
            </div>
            {%if e.image%}
            <img src="media/{{e.image}}" alt="{{e.image}}" height="50px" width="50px"><br>
            {%endif%}
            <input type="submit" class="btn btn-success">
            <a href= "{%url 'user-display'%}" class="btn btn-warning">View all Employee</a>
            <a href="{% url 'user-logout'%}" class="btn btn-primary">Logout</a>
            
    </form>
</div>

</body>
</html>
