<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .table thead {
            background-color: #343a40;
            color: white;
        }

        .table tbody tr:hover {
            background-color: #f2f2f2;
            transition: 0.3s;
        }

        .table th,
        .table td {
            text-align: center;
            vertical-align: middle;
        }

        h2 {
            font-weight: bold;
            color: #343a40;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card p-4">
            <h2 class="text-center mb-4">Employee Details</h2>

            <div class="table-responsive">
                <table class="table table-bordered table-hover table-striped">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Salary</th>
                            <th>Department</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Pincode</th>
                            <th>Image</th>
                            <th colspan="2">Action</th>
                            
                        </tr>
                    </thead>

                    <tbody>
                        {% for e in employe %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ e.fname }}</td>
                            <td>{{ e.email }}</td>
                            <td>{{ e.age }}</td>
                            <td>{{ e.salary }}</td>
                            <td>{{ e.dept }}</td>
                            <td>{{ e.phone }}</td>
                            <td>{{ e.city }}</td>
                            <td>{{ e.pincode }}</td>
                            <td><img src="/media/{{e.image}}" alt="{{e.image}}" height="50px" width="50px"></td>
                            <td><a href="{% url 'user-edit'%}?id={{e.id}}" class="btn btn-primary">Edit</a></td>
                            <td><a href="{% url 'user-delete'%}?id={{e.id}}" class="btn btn-danger">Delete</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>


        </div><br>
        <a href="{% url 'user-add'%}" class="btn btn-warning">Back to Register</a>
    </div>

</body>

</html>
