<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Register Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .form-title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            color: #181819;
        }

        .btn-custom {
            background-color: #4e73df;
            color: white;
            font-weight: 500;
        }

        .btn-custom:hover {
            background-color: #2e59d9;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">Employee View Form</h3>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Address</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for e in employee %}
                        <tr>
                            <td>{{ forloop.counter}}</td>
                            <td>{{ e.name }}</td>
                            <td>{{ e.email }}</td>
                            <td>{{ e.age }}</td>
                            <td>{{ e.dept }}</td>
                            <td>{{ e.salary }}</td>
                            <td>{{ e.address }}</td>
                            <td><a href="{% url 'delete'%}?id={{e.id}}" class="btn btn-danger">Delete</a></td>
                            <td><a href="{% url 'edit'%}?id={{e.id}}" class="btn btn-warning">Edit</a></td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="7" class="text-danger">No Employees Found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <div class="d-grid">
            <a href="{% url 'index'%}" class="btn btn-primary btn-lg">Back to Employee Regsiter</a>
        </div>
            </div>
        </div>
    </div>
</div>
<br>
    


</div>

</body>
</html>
