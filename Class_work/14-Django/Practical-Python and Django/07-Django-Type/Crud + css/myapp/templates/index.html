<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Register Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .form-title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            color: #4e73df;
        }

        .btn-custom {
            background-color: #4e73df;
            color: white;
            font-weight: 500;
        }

        .btn-custom:hover {
            background-color: #2e59d9;
        }
    </style>
</head>

<body>

<div class="register-card">
    <h3 class="form-title">Employee Register Form</h3>

    <form action="{% url 'register'%}" method="post" enctype="multipart/form-data">
        {%csrf_token%}
        <span class="text-success">{{meg}}</span>
        <input type="hidden" name="id" value="{{e.id}}">
        <input type="text" placeholder="Enter Employee Name" class="form-control" name="name" value="{{e.name}}"><br>
        <input type="text" placeholder="Enter Employee Email-id" class="form-control" name="email" value="{{e.email}}"><br>
        <input type="text" placeholder="Enter Employee Age" class="form-control" name="age" value="{{e.age}}"><br>
        <input type="text" placeholder="Enter Employee Salary" class="form-control" name="salary" value="{{e.salary}}"><br>
        <input type="text" placeholder="Enter Employee Department" class="form-control" name="dept" value="{{e.dept}}"><br>
        <input type="text" placeholder="Enter Employee Address" class="form-control" name="address" value="{{e.address}}"><br>
        <input type="file" name="image" class="form-control"><br>
        {% if e.image %}
        <img src="/media/{{e.image}}" alt="{{e.image}}" height="50px" width="50px">
        {%endif%}
        

        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">Register Employee</button>
        </div>
        <br>
         <div class="d-grid">
            <a href="{% url 'display'%}" class="btn btn-primary btn-lg">View Employee</a>
        </div>
    </form>

</div>

</body>
</html>
