<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 12px;
        }

        .table thead {
            background-color: #0d6efd;
            color: white;
        }
    </style>
    <script>
        $(document).ready(function (rt) {
            viewdetalis()
            $("#upbtn").hide()
        })

        function addemployee() {

            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()


            $.post('register', { csrfmiddlewaretoken, name, email, age, dept, salary }, function (rt) {
                alert(rt)


                $("#name").val("")
                $("#email").val("")
                $("#age").val("")
                $("#dept").val("")
                $("#salary").val("")

                viewdetalis()
            })
        }

        function viewdetalis(){
            $.get("display",{},function(rt){
                row = ""
                rt.e.map(ele =>{
                    row+=`<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td>${ele.dept}</td>
                        <td>${ele.salary}</td>
                        <td><button class='btn btn-danger' onclick='Employeedelete(${ele.id})'>Delete</button></td>
                         <td><button class='btn btn-primary' onclick= 'Editemployee(${ele.id})'>Edit</button></td></tr>`
                })
                $("#tdata").html(row)
            })
        }

        function Employeedelete(eid){
            $.get('delete',{eid},function(rt){
                alert(rt)
                 viewdetalis()
            })
        }

        function Editemployee(eid){
            $.get('edit',{eid},function(rt){
                $("#id").val(rt.e[0].id)
                $("#name").val(rt.e[0].name)
                $("#email").val(rt.e[0].email)
                $("#age").val(rt.e[0].age)
                $("#dept").val(rt.e[0].dept)
                $("#salary").val(rt.e[0].salary)

                $("#upbtn").show()
                $("#smbtn").hide()
            
            })
        }

        function update(){
            var  id = $("#id").val()
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var dept = $("#dept").val()
            var salary = $("#salary").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val()


            $.post('update', { csrfmiddlewaretoken,id, name, email, age, dept, salary }, function (rt) {
                alert(rt)


                $("#id").val("")
                $("#name").val("")
                $("#email").val("")
                $("#age").val("")
                $("#dept").val("")
                $("#salary").val("")

                viewdetalis()

              
            })
        
        }



    </script>
</head>

<body>

    <div class="container py-5">

        <!-- Form Card -->
        <div class="card shadow p-4 mb-5 bg-white">
            <h3 class="text-center mb-4">Employee Registration</h3>

            <form action="">
                {%csrf_token%}
                <div class="row g-3">
                    <input type="hidden" name="id" id="id" >
                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" id="name" placeholder="Enter Name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="Enter Email">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" id="age" placeholder="Enter Age">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="dept" id="dept" placeholder="Enter Department">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" class="form-control" name="salary" id="salary" placeholder="Enter Salary">
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-success px-5" onclick="addemployee()" id="smbtn">Submit</button>
                        <button type="submit" class="btn btn-success px-5" onclick="update()" id="upbtn">Update</button>
                        <button type="reset" class="btn btn-primary px-5">Reset</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card shadow p-4 bg-white">
            <h4 class="mb-3">Employee List</h4>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Dept</th>
                            <th>Salary</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tdata">
                        <tr>
                           
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>

</body>

</html>
