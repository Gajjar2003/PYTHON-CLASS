<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-custom {
            background-color: #4CAF50;
            color: white;
        }

        .btn-custom:hover {
            background-color: #45a049;
        }

        table {
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-container">
            <div class="card p-4">
                <h3 class="text-center mb-4">Student Form</h3>

                <form id="studentForm">
                    {%csrf_token%}
                    <input type="hidden" id="id" name="id">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" name="age">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject" name="subject">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone">
                    </div>



                    <button type="button" onclick="addjenil()" class="btn btn-custom w-100" id="smbtn">Submit</button>
                    <button type="button" onclick="updatejenil()" class="btn btn-custom w-100" id="upbtn">Update</button>
                </form>
            </div>
        </div>
        </form>
        <!-- TABLE -->
        <div class="mt-5">
            <h3 class="text-center">Student Data</h3>
            <table class="table table-bordered table-striped text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Subject</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>
                <tbody id="tdata">
                </tbody>
            </table>
        </div>
    </div>

    <script>

        $(document).ready(function (rt) {
            Displayjenil()
            $("#upbtn").hide()
        })



        function addjenil() {
            var name = $("#name").val()
            var age = $("#age").val()
            var subject = $("#subject").val()
            var phone = $("#phone").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()

            $.post('register', { csrfmiddlewaretoken, name, age, phone, subject }, function (rt) {
                alert(rt)
                Displayjenil()
                $("#name").val("")
                $("#age").val("")
                $("#phone").val("")
                $("#subject").val("")
            })
        }

        function Displayjenil() {
            $.get('display', {}, function (rt) {
                row = ""
                rt.st.map(ele => {
                    row += `<tr><td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.age}</td>
                        <td>${ele.subject}</td>
                        <td>${ele.phone}</td>
                       <td><button class='btn btn-danger' onclick=deleteitems(${ele.id})>Delete</button></td>
                       <td><button class='btn btn-primary' onclick="edititems(${ele.id})">Edit</button></td></tr>`
                })
                $("#tdata").html(row)
            })
        }

        function deleteitems(sid) {
            $.get('delete', { sid }, function (rt) {
                alert(rt)
                Displayjenil()
            })
        }

        function edititems(sid) {
            $.get('edit', { sid }, function (rt) {
                $("#id").val(rt.st[0].id)
                $("#name").val(rt.st[0].name)
                $("#age").val(rt.st[0].age)
                $("#subject").val(rt.st[0].subject)
                $("#phone").val(rt.st[0].phone)
                 
                
                $("#upbtn").show()
                 $("#smbtn").hide()
            })
        }

        function updatejenil(){
            var id = $("#id").val()
            var name = $("#name").val()
            var age = $("#age").val()
            var subject = $("#subject").val()
            var phone = $("#phone").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val()

            $.post('update', { csrfmiddlewaretoken, id ,name, age, phone, subject }, function (rt) {
                alert(rt)
                Displayjenil()
                $("#name").val("")
                $("#age").val("")
                $("#phone").val("")
                $("#subject").val("")

                    $("#upbtn").hide()
                 $("#smbtn").show()
            })
        }

    </script>

</body>

</html>
