<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<body>

    <h1 align ="center">Display</h1>
    <table align="center" cellspacing="10" border="2px solid balck" cellpadding="10">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>salary</th>
            <th>Depratment</th>
            <th>Image</th>
            <th colspan="2">Action</th>
        </tr>
        {% for e in employes%}
        <tr>
            <td>{{forloop.counter}}</td>
             <td>{{e.name}}</td>
              <td>{{e.email}}</td>
               <td>{{e.age}}</td>
                <td>{{e.salary}}</td>
                 <td>{{e.dept}}</td>
                    <td><img src="/media/{{e.image}}" alt="{{e.image}}" height="50px" width="50px"></td>
                 <td><a href="{% url 'delete'%}?id={{e.id}}">Delete</a></td>
                 <td><a href="{% url 'edit'%}?id={{e.id}}">Edit</a></td>

        </tr>
        {% endfor %}
    </table>
    <h4 align="center"><a href="{% url 'index'%}">Back to Register</a></h4>
</body>
</html>
