<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col card mt-5 p-5">
                <form action="{% url 'register'%}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <h1 align ="center">Register</h1>
                    <hr>
                    <span class="text-success">{{meg}}</span>
                    <input type="hidden" name="id" value="{{e.id}}">
                    <input type="text" placeholder="Enter your name" class="form-control" name="name" value="{{e.name}}"><br>
                    <input type="text" placeholder="Enter you email" class="form-control" name="email"value="{{e.email}}"><br>
                    <input type="text" placeholder="Enter you age" class="form-control" name="age" value="{{e.age}}"><br>
                    <input type="text" placeholder="Enter your salary" class="form-control" name="salary"value="{{e.salary}}"><br>
                    <input type="text" placeholder="Enter your Depratment" class="form-control" name="dept"value="{{e.dept}}"><br>
                     {% if e %}
                     <img src="media/{{e.image}}" alt="" height="50px" width="50px"><br><br>
                     {% endif %}
                 
                 
                    <input type="file" name="image" class="form-control"><br><br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class="btn btn-primary">
                    <a href="{% url 'display'%}" class="btn btn-danger">View</a>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
