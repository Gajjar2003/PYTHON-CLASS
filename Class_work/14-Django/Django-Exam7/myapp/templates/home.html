<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>wel come to {{user}}</h1>
    <a href="{% url 'logout' %}">Logout</a>
    <table align="center" border="2px solid balck">
        <tr>
            <th>Id</th>
            <th>User-Name</th>
            <th>Password</th>
            <th colspan="2">Action</th>
        </tr>
        {% for s in students%}
        <tr>
            <td>{{s.id}}</td>
            <td>{{s.username}}</td>
            <td>{{s.password}}</td>
            <td><a href="{% url 'delete' %}?id={{s.id}}">Delete</a></td>
            <td><a href="{% url 'edit' %}?id={{s.id}}">Edit</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
