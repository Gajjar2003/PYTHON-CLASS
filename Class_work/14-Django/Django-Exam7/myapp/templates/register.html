<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header text-center">
          <h4>Register</h4>
        </div>
        <div class="card-body">
          <form action="" method="post">
            {% csrf_token %}
            <span class="text-success">{{meg}}</span>
             <span class="text-danger">{{err}}</span>
          
            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" name="fname"  value="{{s.first_name}}">
            </div>

      
            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" name="lname" value="{{s.last_name}}" >
            </div>


            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" name="username" value="{{s.username}}" >
            </div>

          
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" value="{{s.password}}">
            </div>
            <input type="submit" class="btn btn-success">
            <input type="reset" class="btn btn-primary">
            <a href="{% url  'index' %}" class="btn btn-danger">Login</a>
          
            <div class="d-grid">
              
             
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
