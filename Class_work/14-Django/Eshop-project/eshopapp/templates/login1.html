{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/login/login.css">
</head>

<body>
    <form action="{% url 'user-login' %}" method="post">
        {% csrf_token %}
       
    <div class="row">
        <div class="col-md-6 mx-auto p-0">
            <div class="card">
             
                <div class="login-box">
                    <div class="login-snip">
                      
                        <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1"
                            class="tab">Login</label>
                        <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2" class="tab">Sign
                            Up</label>
                         
                        <div class="login-space">
                            <div class="login">
                                <div class="group">
                                    <label for="user" class="label">Username</label>
                                    <input id="user" type="text" class="input" placeholder="Enter your username"
                                        name="name">
                                </div>
                                <div class="group">
                                    <label for="pass" class="label">Password</label>
                                    <input id="pass" type="password" class="input" data-type="password"
                                        placeholder="Enter your password" name="pass">
                                </div>
                                <div class="group">
                                    <input type="submit" class="button" value="Sign In">
                                </div>
                                <div class="hr"></div>
                                      <span>{{err}}</span>

                                <span class="text-success">{{meg}}</span><br>

                            </div>
                            </form>
                            


                            <form action="{% url 'user-register' %}" method="post">
                                {% csrf_token %}

                                <div class="sign-up-form">
                                    <div class="group">
                                        <label for="user" class="label">Username</label>
                                        <input id="user" type="text" class="input" placeholder="Create your Username"
                                            name="name">
                                    </div>
                                    <div class="group">
                                        <label for="user" class="label">Email-id</label>
                                        <input id="user" type="text" class="input" placeholder="Create your email"
                                            name="email">
                                    </div>
                                    <div class="group">
                                        <label for="pass" class="label">Password</label>
                                        <input id="pass" type="password" class="input" data-type="password"
                                            placeholder="Create your password" name="pass">
                                    </div>


                                    <div class="group">
                                        <input type="submit" class="button" value="Sign Up">
                                    </div>
                                    <div class="hr"></div>

                                </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </form>

</body>

</html>
