{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wishlist | Male Fashion</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/elegant-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/themify-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .wishlist-table img {
            width: 80px;
        }
        .wishlist-remove {
            color: red;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Breadcrumb -->
<section class="breadcrumb-option">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumb__text">
                    <h4>Wishlist</h4>
                    <div class="breadcrumb__links">
                        <a href="{% url 'index' %}">Home</a>
                        <span>Wishlist</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Wishlist Section -->
<section class="shopping-cart spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="shopping__cart__table wishlist-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Add to Cart</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Item -->
                            <tr>
                                <td class="product__cart__item">
                                    <div class="product__cart__item__pic">
                                        <img src="{% static 'img/product/product-1.jpg' %}" alt="">
                                    </div>
                                    <div class="product__cart__item__text">
                                        <h6>Piqué Biker Jacket</h6>
                                    </div>
                                </td>
                                <td class="cart__price">$67.24</td>
                                <td>
                                    <a href="#" class="primary-btn">Add to Cart</a>
                                </td>
                                <td class="wishlist-remove">
                                    <i class="fa fa-trash"></i>
                                </td>
                            </tr>

                            <!-- Item -->
                            <tr>
                                <td class="product__cart__item">
                                    <div class="product__cart__item__pic">
                                        <img src="{% static 'img/product/product-2.jpg' %}" alt="">
                                    </div>
                                    <div class="product__cart__item__text">
                                        <h6>Diagonal Textured Cap</h6>
                                    </div>
                                </td>
                                <td class="cart__price">$49.99</td>
                                <td>
                                    <a href="#" class="primary-btn">Add to Cart</a>
                                </td>
                                <td class="wishlist-remove">
                                    <i class="fa fa-trash"></i>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- JS -->
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>

<script>
    $(".wishlist-remove").click(function () {
        $(this).closest("tr").fadeOut(400, function () {
            $(this).remove();
        });
    });
</script>

</body>
</html>
