<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | Clothing Store</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .wishlist-card {
            border-radius: 12px;
            overflow: hidden;
            background: white;
            transition: transform 0.2s;
        }
        .wishlist-card:hover {
            transform: scale(1.02);
        }
        .remove-btn {
            cursor: pointer;
            color: #ff4d4d;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">ClothesStore</a>
    </div>
</nav>

<div class="container my-5">
    <h2 class="mb-4">Your Wishlist ❤️</h2>

    <div id="wishlist-container" class="row gy-4">

        <!-- Example Wishlist Card -->
        <div class="col-md-4 wishlist-item">
            <div class="wishlist-card shadow-sm p-3">
                <img src="https://via.placeholder.com/300x350" class="img-fluid rounded" alt="product">
                <h5 class="mt-3">Men’s Denim Jacket</h5>
                <p class="text-muted">$55.00</p>
                <button class="btn btn-danger remove-btn w-100">Remove</button>
            </div>
        </div>

        <div class="col-md-4 wishlist-item">
            <div class="wishlist-card shadow-sm p-3">
                <img src="https://via.placeholder.com/300x350" class="img-fluid rounded" alt="product">
                <h5 class="mt-3">Women’s Floral Dress</h5>
                <p class="text-muted">$70.00</p>
                <button class="btn btn-danger remove-btn w-100">Remove</button>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Remove wishlist item
    document.addEventListener("click", function(e) {
        if (e.target.classList.contains("remove-btn")) {
            e.target.closest(".wishlist-item").remove();
        }
    });
</script>

</body>
</html>
