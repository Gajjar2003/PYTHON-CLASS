
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Male Fashion</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/elegant-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/themify-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #f8f9fa;
        }
        .auth-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .auth-box h3 {
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }
        .auth-box input {
            height: 45px;
        }
        .auth-box .primary-btn {
            width: 100%;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            color: #111;
            font-weight: 600;
        }
    </style>
</head>
<body>



<!-- Breadcrumb -->
<section class="breadcrumb-option">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="breadcrumb__text">
                    <h4>Account</h4>
                    <div class="breadcrumb__links">
                        <a href="{% url 'index' %}">Home</a>
                        <span>Login / Register</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Login Register Section -->
<section class="checkout spad">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="auth-box" id="login-box">
                    <h3>Login</h3>
                    <form action="{% url 'user-login' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <input type="text" class="form-control" name="username" placeholder="Username" required>
                        </div>
                        <div class="form-group mb-3">
                            <input type="password" class="form-control" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="primary-btn">Login</button>
                        <p class="text-danger mt-2">{{ err }}</p>
                        <p class="text-success mt-2">{{ meg }}</p>
                    </form>
                    <div class="switch-link" onclick="showRegister()">Don't have an account? Register</div>
                </div>

                <div class="auth-box d-none" id="register-box">
                    <h3>Register</h3>
                    <form action="{% url 'user-register' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <input type="text" class="form-control" name="username" placeholder="Username" required>
                        </div>
                        <div class="form-group mb-3">
                            <input type="email" class="form-control" name="email" placeholder="Email" required>
                        </div>
                        <div class="form-group mb-3">
                            <input type="password" class="form-control" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="primary-btn">Register</button>
                    </form>
                    <div class="switch-link" onclick="showLogin()">Already have an account? Login</div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->


<!-- JS -->
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script>
    function showRegister() {
        document.getElementById('login-box').classList.add('d-none');
        document.getElementById('register-box').classList.remove('d-none');
    }
    function showLogin() {
        document.getElementById('register-box').classList.add('d-none');
        document.getElementById('login-box').classList.remove('d-none');
    }
</script>

</body>
</html>
