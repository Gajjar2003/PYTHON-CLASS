<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <head>
    <style>
      
   
        .card{
            background-color: white;
            border-radius: 10px;
            border: 2px solid black;
           
        }
    </style>


</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col card p-3 ">
                <h1 align="center">Register Form</h1>
                <hr>
                <form action="{% url 'register'%}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <span class="text-success">{{meg}}</span><br>
                    <input type="hidden" name="id" value="{{s.id}}">
                     <input type="text" placeholder="Enter your Name" class="form-control" name="name" value="{{s.name}}"><br>
                     <input type="text" placeholder="Enter your Email" class="form-control" name="email" value="{{s.email}}"><br>
                     <input type="text" placeholder="Enter your Age" class="form-control" name="age" value="{{s.age}}"><br>
                     <input type="text" placeholder="Enter your Phone-number" class="form-control" name="phone" value="{{s.phone}}"><br>
                     {% if s %}
                     <img src="media/{{s.image}}" alt="" height="50px" width="50px">
                     {% endif%}
                     <input type="file" name="image" class="form-control"><br>
                     <input type="submit" class="btn btn-success">
                     <input type="reset" class="btn btn-primary">
                     <a href="{% url 'display'%}" class="btn btn-danger">View</a>
                </form>
               
            </div>
        </div>
    </div>

</body>

</html>
