<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disply</title>
</head>
<body>
    <h1 align ="center">Table </h1>
    <table align="center" cellspacing="10" cellpadding="10" border="2px solid balck">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Phone</th>
            <th>Image</th>
            <th colspan="2">Action</th>
        </tr>
        {% for s in students%}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{s.name}}</td>
            <td>{{s.email}}</td>
            <td>{{s.age}}</td>
            <td>{{s.phone}}</td>
            <td><img src="/media/{{s.image}}" alt="{{s.image}}" height="50px" width="50px"></td>
            <td><a href="{% url 'delete'%}?id={{s.id}}">Delete</a></td>
             <td><a href="{% url 'edit' %}?id={{s.id}}">Edit</a></td>


        </tr>
        {% endfor %}
    </table>
    <h3 align="center"><a href="{% url 'index'%}">BAck to home page</a></h3>

    
</body>
</html>
