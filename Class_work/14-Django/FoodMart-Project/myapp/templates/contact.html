{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact Us | FoodMart</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
    }
    .page-title {
      background: url("{% static 'images/background-pattern.jpg' %}") center/cover;
      padding: 70px 0;
      color: #fff;
      text-align: center;
    }
    .contact-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 12px;
    }
    .icon {
      font-size: 30px;
      color: #28a745;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="{% static 'images/logo.png' %}" height="40">
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index'%}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'cart'%}">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'about'%}">About</a></li>
        <li class="nav-item">
          <a class="nav-link active fw-bold text-success" href="">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</header>

<!-- PAGE TITLE -->
<section class="page-title">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you</p>
</section>

<!-- CONTACT -->
<section class="py-5">
  <div class="container">
    <div class="row g-4">

      <!-- CONTACT INFO -->
      <div class="col-md-4">
        <div class="contact-box text-center">
          <div class="icon mb-2">📍</div>
          <h5>Our Address</h5>
          <p>Ahmedabad, Gujarat, India</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="contact-box text-center">
          <div class="icon mb-2">📞</div>
          <h5>Call Us</h5>
          <p>+91 98765 43210</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="contact-box text-center">
          <div class="icon mb-2">✉️</div>
          <h5>Email</h5>
          <p>support@foodmart.com</p>
        </div>
      </div>

    </div>

    <!-- FORM -->
    <div class="row mt-5">
      <div class="col-md-8 mx-auto">
        <div class="contact-box">
          <h4 class="mb-3 text-center">Send Us a Message</h4>
          <form method="post">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="text" class="form-control" placeholder="Your Name" required>
              </div>
              <div class="col-md-6 mb-3">
                <input type="email" class="form-control" placeholder="Your Email" required>
              </div>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Subject">
            </div>
            <div class="mb-3">
              <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
            </div>
            <button class="btn btn-success w-100">Send Message</button>
          </form>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- FOOTER -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
