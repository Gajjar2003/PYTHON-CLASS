<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Food Mart - Address Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: #e5f7ee;
        }

        .address-box,
        .address-form {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .address-box h4,
        .address-form h4 {
            color: #198754;
        }

        .address-box p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-success {
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="index.html">
                <img src="/static/images/logo.png" alt="logo" class="img-fluid">
            </a>
        </div>
    </nav>

    <!-- Address Section -->
    <div class="container my-5">
        <div class="row g-4">

            <!-- Food Mart Address -->
            <div class="col-md-5">
                <div class="address-box">
                    <h4><i class="fa-solid fa-store"></i> Food Mart Address</h4>
                    <hr>
                    <p><i class="fa-solid fa-location-dot"></i> G-101 Krishan Market Road, Surat</p>
                    <p><i class="fa-solid fa-phone"></i> +91 98765 43210</p>
                    <p><i class="fa-solid fa-envelope"></i> foodmart1108@gmail.com</p>
                    <p><i class="fa-solid fa-clock"></i> Open: 8 AM – 10 PM</p>
                </div>
            </div>

            <!-- Delivery Address Form -->
            <div class="col-md-7">
                <div class="address-form">
                    <h4>Delivery Address</h4>
                    <hr>
                    <form method="POST" action="{% url 'address' %}">
                        {% csrf_token %}

                        <span class="text-success">{{ msg }}</span>

                        <input type="text" name="fname" class="form-control mb-2" placeholder="Full Name">
                        <input type="text" name="phone" class="form-control mb-2" placeholder="Phone">
                        <input type="text" name="house" class="form-control mb-2" placeholder="House">
                        <input type="text" name="area" class="form-control mb-2" placeholder="Area">
                        <input type="text" name="city" class="form-control mb-2" placeholder="City">
                        <input type="text" name="code" class="form-control mb-2" placeholder="Pincode">
                        <textarea name="land" class="form-control mb-3"></textarea>

                        <div class="row g-2">
                            <div class="col-6 d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    Save Address
                                </button>
                            </div>

                            <div class="col-6 d-grid">
                                <a href="{% url 'index' %}" class="btn btn-primary btn-lg">
                                    Back To Home
                                </a>
                            </div>
                        </div>


                    </form>

                </div>
            </div>

        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
