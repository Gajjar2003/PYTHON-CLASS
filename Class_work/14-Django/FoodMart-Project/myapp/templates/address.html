<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Mart - Add Address</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .address-card {
            border-radius: 12px;
        }

        .address-header {
            background: #198754;
            color: #fff;
            padding: 15px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #198754;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow address-card">

                <!-- Header -->
                <div class="address-header">
                    <h3>🏠 Add Delivery Address</h3>
                    <p class="mb-0">Food Mart</p>
                </div>

                <!-- Form -->
                <div class="card-body">
                    <form method="POST">
                          {% csrf_token %}
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter full name" name="fname">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" placeholder="Enter mobile number" name="phone">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">House / Flat / Building</label>
                            <input type="text" class="form-control" placeholder="House No, Building name" name="house">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Area / Street</label>
                            <input type="text" class="form-control" placeholder="Area, Street" name="area">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" placeholder="City" name="city">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" placeholder="State" name="land">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Pincode</label>
                                <input type="text" class="form-control" placeholder="Pincode" name="code">
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success px-5">Save Address</button>
                            <a href="{% url 'checkout'%}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
