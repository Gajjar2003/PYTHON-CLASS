{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Cart | FoodMart</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <style>

    body {
      font-family: 'Nunito', sans-serif;
     
    }

    .cart-img {
      width: 80px;
      border-radius: 8px;
    }

    .qty-input {
      width: 60px;
      text-align: center;
    }

    .price {
      font-weight: 700;
      color: #28a745;
    }

    .cart-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <img src="{% static 'images/logo.png' %}" height="40">
      </a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'index'%}">Home</a></li>

          <li class="nav-item">
            <a class="nav-link active fw-bold text-success" href="/cart">Cart</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about'%}">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- PAGE TITLE -->
  <section class="py-4 bg-light text-center">
    <h2>Your Shopping Cart</h2>
  </section>

  <!-- CART -->
  <section class="py-5">
    <div class="container">
      <div class="row">

        <!-- CART TABLE -->
        <div class="col-md-8 mb-4">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th width="120">Quantity</th>
                  <th>Total</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>
                <!-- ITEM -->
                {% for c in carts%}
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <img src="media/{{c.product.image}}" class="cart-img me-3">
                      <strong>{{c.product.name}}</strong>
                    </div>
                  </td>
                  <td class="price">Rs : {{c.product.price}}</td>
                  <td>
                    <input type="number" value="{{c.qty}}" min="1" class="form-control qty-input" onchange="changeqty(value,'{{c.id}}')">
                  </td>
                  <td class="price">Rs : {{c.total_price}}</td>
                  <td>
                    <button class="btn btn-sm btn-danger" onclick="removecard('{{c.id}}')">X</button>
                  </td>
                </tr>
                {% endfor %}


              </tbody>
            </table>
          </div>
        </div>




        <!-- SUMMARY -->
        <div class="col-md-4">
          <div class="cart-summary">
            <h5>Cart Summary</h5>
            <hr>
            <p class="d-flex justify-content-between">
              <span>Subtotal</span>
              <span>{{total}}</span>
            </p>
            <p class="d-flex justify-content-between">
              <span>Delivery</span>
              <span>00</span>
            </p>
            <hr>
            <h5 class="d-flex justify-content-between">
              <span>Total</span>
              <span id="amt">{{total}}</span>
            </h5>

            <button class="btn btn-success w-100 mt-3" id="rzp-button1">
              Proceed to Checkout
            </button><br>
            <a href="{% url 'index'%}" class="btn btn-primary w-100 mt-3">Shop now </a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script>
    function removecard(cid){
      $.get("removecard",{cid},function(rt){
        location.reload()
      })
    }
    function changeqty(qty,cid){
      $.get("changeqty",{qty,cid},function(rt){
        location.reload()
      })
    }

  </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>


    <script>

        document.getElementById('rzp-button1').onclick = function (e) {

            e.preventDefault();
            var amt = $("#amt").html()
            
            $.get("payment", { amt }, function (rt) {

                var options = {
                    "key": "rzp_test_S1Hsg7YN8MlwDU", // Enter the Key ID generated from the Dashboard
                    "amount": rt.amount, // Amount is in currency subunits. 
                    "currency": "INR",
                    "name": "Food-Mart",
                    "description": "Test Transaction",
                    "image": "https://example.com/your_logo",
                    "order_id": rt.id, //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
                    "handler": function (response) {
                        // alert(response.razorpay_payment_id);
                        // alert(response.razorpay_order_id);
                        // alert(response.razorpay_signature)
                        $.get("makeorder",{'payid':response.razorpay_payment_id},function(rt){
                          alert(rt)
                          location.reload()
                        })
                    },
                    "prefill": {
                        "name": "<name>",
                        "email": "<email>",
                        "contact": "<phone>"
                    },
                    "notes": {
                        "address": "Razorpay Corporate Office"
                    },
                    "theme": {
                        "color": "#3399cc"
                    }
                };
                var rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response) {
                    alert(response.error.code);
                    alert(response.error.description);
                    alert(response.error.source);
                    alert(response.error.step);
                    alert(response.error.reason);
                    alert(response.error.metadata.order_id);
                    alert(response.error.metadata.payment_id);
                });


                rzp1.open();
            })


        }
    </script>



  <!-- FOOTER -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</body>

</html>
