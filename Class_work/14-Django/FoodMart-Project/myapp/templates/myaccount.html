{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMart | Register & Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body{
            min-height:100vh;
           
            font-family: 'Segoe UI', sans-serif;
            background: url('/static/images/background-pattern.jpg') no-repeat center;
           
        }
        .brand{
            font-weight: 700;
            color: #ff3c6f;
        }
        .auth-card{
            border: none;
            border-radius: 20px;
            transition: transform .3s ease, box-shadow .3s ease;
               background: linear-gradient(135deg, #fbc99a, #fb92ae)
        }
        .auth-card:hover{
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,.2);
        }
        .form-control{
            border-radius: 30px;
            padding: 12px 18px;
        }
        .btn-round{
            border-radius: 30px;
            padding: 10px;
            font-weight: 600;
        }
        .btn-register{
            background: linear-gradient(45deg, #28a745, #6ddf8e);
            border: none;
        }
        .btn-login{
            background: linear-gradient(45deg, #007bff, #4da3ff);
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="text-center text-white fw-bold mt-4 mb-5">
    <span class="brand">FoodMart Account</span> 
    </h2>

    <div class="row justify-content-center g-4">

        <!-- Register -->
        <div class="col-md-5">
            <div class="card auth-card p-4">
                <h4 class="text-center mb-4">Create Account</h4>
                <form method="post"action="">
                  {% csrf_token %}
                    <span class="text-success">{{meg}}</span><br>
                    <span class="text-danger">{{err}}</span><br>
                    <input type="text" class="form-control mb-3" placeholder="First Name" name="fname" required>
                    <input type="text" class="form-control mb-3" placeholder="Last Name" name="lname" required>
                    <input type="text" class="form-control mb-3" placeholder="Username" name="username" required>
                    <input type="password" class="form-control mb-3" placeholder="Password" name="password" required>

                    <button class="btn btn-register btn-round w-100 text-white">
                        Register
                    </button>
                </form>
            </div>
        </div>

        <!-- Login -->
        <div class="col-md-5">
            <div class="card auth-card p-4">
                <h4 class="text-center mb-4">Welcome Back</h4>
                <form method="post" action="user-login">
                     {% csrf_token %}
                     <span class="text-danger">{{err}}</span>

                    <input type="text" class="form-control mb-3" placeholder="Username" name="username" required>
                    <input type="password" class="form-control mb-3" placeholder="Password" name="password" required>

                    <button class="btn btn-login btn-round w-100 text-white">
                        Login
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>

</body>
</html>
