<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-5 pt-5 mx-auto card">
                <form action="" method="post">
                    {%csrf_token%}
                    <h1 align="center">Login</h1>
                    <hr>
                    
                    <span class="text-danger">{{err}}</span>
         
                    <input type="text" placeholder="Enter Username" class="form-control" name="username"><br><br>
                    <input type="password" placeholder="Enter Password" class="form-control" name="password"><br><br>
                    <input type="submit" class="btn btn-success">
                     <input type="reset" class="btn btn-primary">
                     <a href="{% url 'register' %}" class="btn btn-danger">Register</a><br><br><br><br>


                </form>
            </div>
        </div>
    </div>
</body>

</html>
