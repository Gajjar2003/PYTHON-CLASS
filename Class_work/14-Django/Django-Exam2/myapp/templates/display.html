<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 align="center">table</h1>
    <table align="center" border="4px solid balck ">
        <tr>
            <th>id</th>
             <th>name</th>
              <th>email</th>
               <th>age</th>
               <th>Image</th>
               <th colspan="2">Action</th>
        </tr>
        {% for s in students%}
        <tr>
            <td>{{s.id}}</td>
              <td>{{s.name}}</td>
                <td>{{s.email}}</td>
                  <td>{{s.age}}</td>
                  <td><img src="/media/{{s.image}}" alt="{{s.image}}" height="20px" width="20px"></td>

                  <td><a href="{% url 'delete'%}?id={{s.id}}">Delete</a></td>
                   <td><a href="{% url 'edit'%}?id={{s.id}}">Edit</a></td>

        </tr>
        {% endfor %}

    </table>
    <a href="{% url 'index'%}">back</a>
    
</body>
</html>
