<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<body>
    <h1 align="center">Employee Table For Details</h1>
    <table border="4px solid balck" cellspacing="10" cellpadding="10" align="center" style="background-color: bisque;">
        <tr>
            <th>Id</th>
            <th>E-name</th>
            <th>E-email</th>
            <th>E-age</th>
            <th>E-salary</th>
            <th>E-department</th>
            <th>image</th>
            <th colspan="2">Action</th>
        </tr>
        {% for e in employees %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{e.name}}</td>
            <td>{{e.email}}</td>
            <td>{{e.age}}</td>
            <td>{{e.salary}}</td>
            <td>{{e.department}}</td>
            <td><img src="media/{{e.image}}" alt="{{e.image}}" height="50px" width="50px"></td>

            <td><a href="{% url 'delete'%}?id={{e.id}}">Delete</a></td>
            <td><a href="{% url 'edit' %}?id={{e.id}}">Edit</a></td>
        </tr>
        {%endfor%}
    </table>
    <h3 align="center"><a href="{% url 'index'%}">Back to home pages</a></h3>
</body>
</html>
