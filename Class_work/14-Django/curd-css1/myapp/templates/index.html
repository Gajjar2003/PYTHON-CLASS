<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col-5 card p-3">
         
                <form action="{% url 'user-login'%}" method="post">
                
                    
                           <h1 class="mt-3 p-2">Login</h1>
                               {% csrf_token %}
                               <span class="text-danger"> {{err}}</span>
                           <hr>
                    <input type="text" placeholder="Enter your Username" class="form-control" name="name"><br>
                    <input type="text" placeholder="Enter your password" class="form-control" name="pass"><br>
                    <input type="submit" class="btn btn-success">
                    <input type="reset" class=" btn btn-primary">
                    <a href="{% url 'register'%}" class="btn btn-danger">register</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
