<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>

      <a href="{% url 'user-logout'%}" class="btn btn-warning mt-3 " style="margin-left: 25px;">Logout </a>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h3 class="text-center mb-4">Employee Form</h3>

        <form action="{% url 'insert'%}" method="post" enctype="multipart/form-data">
            {%csrf_token%}
            <span class="text-success">{{msg}}</span><br>
           
             <input type="hidden" name="id" value="{{e.id}}">
            <div class="mb-3">
                <label class="form-label">Employee Name</label>
                <input type="text" class="form-control" placeholder="Enter name" name="name" value="{{e.name}}">
            </div>

        
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" placeholder="Enter department" name="dept" value="{{e.dept}}">
            </div>

    
            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="number" class="form-control" placeholder="Enter salary" name="salary" value="{{e.salary}}">
            </div>


            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" class="form-control" placeholder="Enter age" name="age" value="{{e.age}}">
            </div>

      
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter email" name="email" value="{{e.email}}">
            </div>

         
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" placeholder="Enter phone number" name="phone" value="{{e.phone}}">
            </div>

             {% if e%}
            <img src="media/{{e.image}}" alt="{{e.image}}" height="25px" width="25px">
            {% endif %}
            <input type="file" name="image"><br><br>
           
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Submit</button><br>
                <a href="{% url 'display'%}" class="btn btn-primary">Display</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
