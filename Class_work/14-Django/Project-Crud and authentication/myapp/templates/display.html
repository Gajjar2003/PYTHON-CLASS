<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        table th {
            background-color: #0d6efd;
            color: white;
            text-align: center;
        }

        table td {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Employee Details</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Salary</th>
                        <th>Image</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in employees %}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{e.name}}</td>
                        <td>{{e.dept}}</td>
                        <td>{{e.email}}</td>
                        <td>{{e.age}}</td>
                        <td>{{e.phone}}</td>
                         <td>{{e.salary}}</td>
                        <td><img src="media/{{e.image}}" alt="{{e.image}}"></td>
                         <td><a href="{% url 'delete'%}?id={{e.id}}" class="btn btn-danger">Delete</a></td>
                         <td><a href="{% url 'edit' %}?id={{e.id}}" class="btn btn-primary">Edit</a></td>

                    </tr>
                  {% endfor %}
                </tbody>
            </table>
            <a href="{% url 'home'%}" class="btn btn-warning">Back to Register</a>
            <a href="{% url 'show' %}" class="btn btn-primary">Image For Crud and Authentication </a>
        </div>
    </div>

</body>

</html>
