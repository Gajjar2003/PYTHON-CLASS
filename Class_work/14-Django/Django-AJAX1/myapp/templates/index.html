<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AJAX CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }
        .card { border-radius: 15px; }
        .form-control, .btn { border-radius: 10px; }
        table thead { background-color: #4f46e5; color: white; }
    </style>

    <script>
        $(document).ready(function () {
            viewstudent();
            $("#upbtn").hide();
        });

        function addstudent() {
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();
            var name = $("#name").val();
            var email = $("#email").val();
            var phone = $("#phone").val();

            $.post("register", { csrfmiddlewaretoken, name, email, phone }, function (rt) {
                alert(rt);
                clearForm();
                viewstudent();
            });
        }

        function viewstudent() {
            var row = "";
            $.get("display", {}, function (rt) {
                rt.students.map(ele => {
                    row += `
                    <tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.phone}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deletestudent(${ele.id})">Delete</button>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="getbyid(${ele.id})">Edit</button>
                        </td>
                    </tr>`;
                });
                $("#tdata").html(row);
            });
        }

        function deletestudent(sid) {
            $.get("delete", { sid }, function (rt) {
                alert(rt);
                viewstudent();
            });
        }

        function getbyid(sid) {
            $.get("getbyid", { sid }, function (rt) {
                $("#id").val(rt.student[0].id);
                $("#name").val(rt.student[0].name);
                $("#email").val(rt.student[0].email);
                $("#phone").val(rt.student[0].phone);

                $("#smbtn").hide();
                $("#upbtn").show();
            });
        }

        function updatestudent() {
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();
            var id = $("#id").val();
            var name = $("#name").val();
            var email = $("#email").val();
            var phone = $("#phone").val();

            $.post("update", { csrfmiddlewaretoken, id, name, email, phone }, function (rt) {
                alert(rt);
                clearForm();
                $("#upbtn").hide();
                $("#smbtn").show();
                viewstudent();
            });
        }

        function clearForm() {
            $("#id").val("");
            $("#name").val("");
            $("#email").val("");
            $("#phone").val("");
        }


         function search(value) {
            $.get("search", { value }, function (rt) {

                var rows = ""
                rt.students.map(ele => {
                    rows += `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.phone}</td>
                        <td><button class='btn btn-danger' onclick='deletestudent(${ele.id})'>Delete</button></td>
                        <td><button class='btn btn-primary' onclick='getbyid(${ele.id})'>Edit</button></td></tr>`
                })
                $("#tdata").html(rows)
            })
        }

    </script>
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg">
                <div class="card-header text-center bg-primary text-white">
                    <h3>Student Registration</h3>
                </div>

                <div class="card-body">
                    <form onsubmit="return false;">
                        {% csrf_token %}
                        <input type="hidden" id="id">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" id="name" class="form-control" placeholder="Name">
                            </div>
                            <div class="col-md-4">
                                <input type="email" id="email" class="form-control" placeholder="Email">
                            </div>
                            <div class="col-md-4">
                                <input type="text" id="phone" class="form-control" placeholder="Phone">
                            </div>

                            <div class="col-12 text-center mt-3">
                                <button id="smbtn" type="button" class="btn btn-success" onclick="addstudent()">Submit</button>
                                <button id="upbtn" type="button" class="btn btn-warning" onclick="updatestudent()">Update</button>
                                <button type="reset" class="btn btn-secondary ms-2">Reset</button>
                            </div>
                        </div>
                    </form>

                    <div class="table-responsive mt-4">
                        <input type="text" class="form-control" placeholder="Enter your student search" onkeyup="search(value)"><br>
                        <table class="table table-bordered text-center">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th colspan="2">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tdata"></tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
