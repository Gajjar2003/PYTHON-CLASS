<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">
        <div class="row">
            <div class="col">

                <table class="table table-bordered table-striped table-hover text-center">

                    <tr class="table-light">
                        <th>ID</th>
                        <th>NO</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Type</th>
                        <th>Fromate</th>
                        <th>Run</th>
                        <th>100/50</th>
                        <th>Highest-scores</th>
                        <th>Avg</th>
                        <th>Four</th>
                        <th>Six</th>
                        <th colspan="2">Action</th>
                    </tr>
                    
                    {% for c in crickets%}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{c.no}}</td>
                        <td>{{c.name}}</td>
                        <td>{{c.age}}</td>
                        <td>{{c.email}}</td>
                        <td>{{c.type}}</td>
                        <td>{{c.fromate}}</td>
                        <td>{{c.run}}</td>
                        <td>{{c.con}}</td>
                        <td>{{c.score}}</td>
                        <td>{{c.avg}}</td>
                        <td>{{c.four}}</td>
                        <td>{{c.six}}</td>
                        <td><a href="{% url 'delete' %}?id={{c.id}}">Delete</a></td>
                        <td><a href="{% url 'edit' %}?id={{c.id}}">Edit</a></td>

                    </tr>


                    {% endfor %}



                </table>
                
                <a href="{% url 'index'%}" class="btn btn-info">Back</a>

            </div>
        </div>
    </div>

</body>

</html>
