<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TOPS Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <img src="logo-tops.png" alt="logo">
            </div>
            <div class="title"> Student Registration & Accounting System</div>

        </header>
        
         <div class="main">

            <div class="login">
                <h2>Login</h2>
                <br>
                <table cellspacing="10" cellpadding="10">

                    <tr>
                        <td>
                            <label for="">Login AS</label>
                        </td>
                        <td>
                            <select name="" id="" class="dropdown">
                                <option value="">Accounting</option>
                                <option value="">Admin</option>
                                <option value="">Faculty</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">Username</label></td>
                        <td>
                            <input type="text" class="textfield">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">Password</label></td>
                        <td>
                            <input type="password" class="textfield">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" class="btn" name="" id="">
                            <input type="reset" class="btn">
                        </td>
                    </tr>
                </table>
            </div>

        </div>
        <footer>
            <span>Copyright © 2025 TOPS International</span>
        </footer>


    </div>


</body>
</html>
