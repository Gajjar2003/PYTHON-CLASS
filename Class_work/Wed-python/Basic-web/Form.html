<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM-PAGES</title>
</head>
<body>
    <fieldset>
     <legend>Registration Form</legend>
    <form action="" method="post">

        <label for="name">Name</label>
        <input type="text" name="name" id = "name"><br><br>

        <label for="email">Email</label>
        <input type="text" name="email" id="email"><br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password"><br><br>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="1" value="Male">Male
        <input type="radio" name="gender" id="2" value="Female">Female <br><br>

        <label for="">Language</label>
        <input type="checkbox" name="Gujarati" id="1" value="Gujarati">Gujarati
        <input type="checkbox" name="Hindi" id="2" value="Hindi">Hindi
        <input type="checkbox" name="English" id = "3" value="English"> English <br><br>

            <label for="">Country</label>
            <select name="Country" id="country">
                <option value="1">India</option>
                <option value="2">USA</option>
                <option value="3">UK</option>
            </select> <br><br>

            <label for="">Address</label>
            <textarea name="adr" id="adr"></textarea><br><br>

            <input type="submit">
            <input type="reset">



    </form>
    </fieldset>
</body>
</html>
